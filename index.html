<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MTG Decks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">MTG DECKS</a>
      <nav class="nav" aria-label="Primary">
        <a href="deck.html">Deck</a>
        <a href="stats.html">Stats</a>
      </nav>
    </header>
    <main class="home">
      <div class="home-stack">
        <button type="button" class="new-deck" id="new-deck">New deck</button>
        <div class="dropbox" id="dropbox">
          <div class="dropbox-prompt" id="dropbox-prompt">
            <p class="dropbox-title">Drop a decklist here</p>
            <button type="button" class="browse" id="browse">Browse</button>
          </div>
          <div class="progress-ring" id="progress" hidden>
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-track" cx="60" cy="60" r="52"></circle>
              <circle class="ring-value" id="ring-value" cx="60" cy="60" r="52"></circle>
            </svg>
            <p class="ring-label" id="ring-label" aria-live="polite">0%</p>
          </div>
          <p class="status" id="home-status" role="status"></p>
          <input id="decklist-file" type="file" accept=".txt,text/plain" hidden />
        </div>
      </div>
    </main>
    <script src="library.js"></script>
    <script src="home.js"></script>
  </body>
</html>
