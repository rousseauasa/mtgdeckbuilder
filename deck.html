<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deck · MTG Decks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-deck">
    <header class="topbar">
      <a class="brand" href="index.html">MTG DECKS</a>
      <nav class="nav" aria-label="Primary">
        <a href="deck.html" aria-current="page">Deck</a>
        <a href="stats.html" id="nav-stats">Stats</a>
        <a href="devlog.html">Devlog</a>
        <a href="credits.html">Credits</a>
      </nav>
    </header>
    <div class="workspace">
      <main class="canvas-viewport" id="viewport" aria-label="Deck canvas">
        <div class="canvas-world" id="world"></div>
        <form class="commander" id="commander-form">
          <label for="commander-name">Commander</label>
          <input
            id="commander-name"
            type="text"
            placeholder="Card name"
            autocomplete="off"
            aria-describedby="commander-status"
          />
          <p class="commander-status" id="commander-status" role="status"></p>
          <img class="commander-preview" id="commander-preview" alt="" hidden />
        </form>
        <div class="decklist-bar">
          <p class="card-count" id="card-count">0 cards</p>
          <p class="decklist-status" id="decklist-status" role="status"></p>
          <button type="button" class="save-deck" id="save-deck">Save</button>
        </div>
      </main>
      <aside class="sidebar" id="sidebar" aria-label="Card search">
        <div class="sidebar-head">
          <div class="sidebar-search-row">
            <form class="search" id="search-form">
              <input
                id="card-query"
                name="q"
                type="search"
                placeholder="Search for a card"
                aria-label="Card name"
                autocomplete="off"
              />
              <button type="submit">Search</button>
            </form>
            <button type="button" class="sidebar-collapse" id="sidebar-collapse" aria-expanded="true" aria-controls="sidebar" aria-label="Collapse sidebar">▴</button>
          </div>
          <p class="status" id="search-status" role="status"></p>
          <button type="button" class="new-category" id="new-category">New category</button>
          <button type="button" class="new-category" id="new-note">New note</button>
          <details class="category-index">
            <summary>Categories</summary>
            <div class="category-index-scroll">
              <table>
                <tbody id="category-list"></tbody>
              </table>
            </div>
          </details>
        </div>
        <ul class="results" id="results" aria-label="Search results"></ul>
      </aside>
    </div>
    <div class="drag-ghost" id="drag-ghost" hidden></div>
    <img class="hover-preview" id="hover-preview" alt="" hidden />
    <div class="legality-tooltip" id="legality-tooltip" role="tooltip" hidden>
      <img id="legality-tooltip-icon" alt="" />
      <span id="legality-tooltip-text"></span>
    </div>
    <div class="card-menu" id="card-menu" role="menu" hidden>
      <button type="button" role="menuitem" id="menu-delete">Delete card</button>
      <button type="button" role="menuitem" id="menu-details">Card details</button>
      <button type="button" role="menuitem" id="menu-flip">Flip card</button>
      <button type="button" role="menuitem" id="menu-printing">Change printing</button>
      <button type="button" role="menuitem" id="menu-commander">Make commander</button>
      <button type="button" role="menuitem" id="menu-category">Add to category</button>
    </div>
    <div class="category-picker" id="category-picker" hidden>
      <button type="button" class="category-picker-backdrop" id="category-picker-backdrop" aria-label="Close"></button>
      <div class="category-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="category-picker-title" tabindex="-1">
        <h2 id="category-picker-title">Add to category</h2>
        <p class="category-picker-empty" id="category-picker-empty" hidden>No categories yet.</p>
        <div class="category-picker-list" id="category-picker-list"></div>
      </div>
    </div>
    <div class="category-picker" id="printing-picker" hidden>
      <button type="button" class="category-picker-backdrop" id="printing-picker-backdrop" aria-label="Close"></button>
      <div class="category-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="printing-picker-title" tabindex="-1">
        <h2 id="printing-picker-title">Choose printing</h2>
        <p class="printing-picker-status" id="printing-picker-status" role="status"></p>
        <div class="category-picker-list" id="printing-picker-list"></div>
      </div>
    </div>
    <div class="card-details" id="card-details" hidden>
      <button type="button" class="card-details-backdrop" id="card-details-backdrop" aria-label="Close"></button>
      <div class="card-details-dialog" role="dialog" aria-modal="true" aria-labelledby="card-details-title" tabindex="-1">
        <button type="button" class="card-details-close" id="card-details-close" aria-label="Close card details">×</button>
        <div class="card-details-media">
          <img id="card-details-image" alt="" hidden />
          <p class="card-details-noimage" id="card-details-noimage" hidden>No image available</p>
        </div>
        <div class="card-details-info">
          <h2 id="card-details-title"></h2>
          <p class="card-details-status" id="card-details-status" role="status"></p>
          <div id="card-details-body"></div>
        </div>
      </div>
    </div>
    <script src="library.js"></script>
    <script src="deck.js"></script>
  </body>
</html>
